<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Jessica's Pocket Worlds</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pocket Worlds">
<meta name="theme-color" content="#ffd6e8">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --pink: #ff8fc2;
    --pink-soft: #ffd6e8;
    --lilac: #c9a7ff;
    --mint: #9ff0d4;
    --aqua: #8fdcff;
    --ink: #5a3a5e;
    --ink-soft: #9b7aa0;
    --gold: #ffcf5a;
    --bg: linear-gradient(180deg, #ffe3f1 0%, #f3e6ff 55%, #e3f6ff 100%);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: var(--bg);
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  body {
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    display: flex; flex-direction: column;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  .hidden { display: none !important; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 0 6px;
  }
  .coins {
    background: #fff; border-radius: 999px; padding: 6px 14px 6px 8px;
    font-weight: 700; display: flex; align-items: center; gap: 6px;
    box-shadow: 0 3px 0 rgba(90,58,94,.12);
  }
  .coin { width: 22px; height: 22px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff3b8, var(--gold) 60%, #e0a92a);
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.12); }
  .gift {
    border: 0; background: #fff; border-radius: 14px; width: 44px; height: 44px;
    font-size: 22px; box-shadow: 0 3px 0 rgba(90,58,94,.12);
  }
  h1 {
    text-align: center; margin: 6px 0 2px; font-size: 30px; line-height: 1.05;
    letter-spacing: .5px;
    background: linear-gradient(90deg, var(--pink), var(--lilac));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { text-align: center; margin: 0 0 10px; color: var(--ink-soft); font-size: 14px; }

  /* Home doll card */
  .doll-card {
    display: flex; align-items: center; gap: 12px; border: 0; width: 100%;
    background: rgba(255,255,255,.7); border-radius: 22px; padding: 8px 14px 8px 8px;
    box-shadow: 0 4px 0 rgba(90,58,94,.1); text-align: left; margin-bottom: 10px;
  }
  .doll-card svg { width: 64px; height: 90px; flex: none; }
  .doll-card b { display: block; font-size: 17px; }
  .doll-card span { font-size: 13px; color: var(--ink-soft); }
  .doll-card .go { margin-left: auto; font-size: 24px; color: var(--pink); }

  /* Compact shelf */
  .shelf {
    display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory;
    padding: 8px 4px 22px; scrollbar-width: none;
  }
  .shelf::-webkit-scrollbar { display: none; }
  .shelf-board {
    height: 14px; border-radius: 8px; margin-top: -18px;
    background: linear-gradient(180deg, #f6c9dc, #e9a9c6);
    box-shadow: 0 6px 12px rgba(90,58,94,.15);
  }
  .compact {
    flex: 0 0 150px; scroll-snap-align: center;
    border: 0; padding: 0; background: none; text-align: center; color: var(--ink);
  }
  .shell {
    width: 150px; height: 150px; border-radius: 50% 50% 46% 46%;
    position: relative; margin: 0 auto;
    box-shadow: inset 0 -10px 0 rgba(0,0,0,.08), inset 0 8px 14px rgba(255,255,255,.7), 0 8px 16px rgba(90,58,94,.18);
    display: grid; place-items: center;
    transition: transform .2s;
  }
  .compact:active .shell { transform: scale(.96); }
  .shell::before {
    content: ""; position: absolute; top: -6px; width: 46px; height: 14px; border-radius: 8px;
    background: rgba(255,255,255,.75);
  }
  .gem {
    width: 48px; height: 48px; border-radius: 14px; transform: rotate(45deg);
    background: linear-gradient(135deg, #fff, rgba(255,255,255,.2));
    box-shadow: 0 0 0 6px rgba(255,255,255,.45);
  }
  .compact .name { font-weight: 800; margin-top: 10px; font-size: 15px; }
  .compact .info { font-size: 12px; color: var(--ink-soft); }
  .locked .shell { filter: grayscale(.7) brightness(1.05); opacity: .7; }
  .lock { position: absolute; font-size: 32px; }

  /* Mode buttons */
  .modes { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 14px; }
  .mode {
    border: 0; border-radius: 22px; padding: 14px 6px 10px; font-weight: 800; font-size: 15px;
    box-shadow: 0 5px 0 rgba(90,58,94,.15);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .mode:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(90,58,94,.15); }
  .mode .ico { font-size: 28px; }
  .m-dress { background: var(--pink-soft); }
  .m-deco  { background: #e7dbff; }
  .m-play  { background: #d4f7ea; }
  .play-big {
    margin-top: 12px; width: 100%; border: 0; border-radius: 26px; padding: 16px;
    font-weight: 900; font-size: 22px; color: #fff;
    background: linear-gradient(90deg, var(--pink), var(--lilac));
    box-shadow: 0 6px 0 #b77bd6;
  }
  .play-big:active { transform: translateY(4px); box-shadow: 0 2px 0 #b77bd6; }
  .play-big small { display: block; font-size: 13px; font-weight: 700; opacity: .9; }

  /* Full-screen sub screens */
  .screen {
    position: fixed; inset: 0; z-index: 10; background: var(--bg);
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    display: flex; flex-direction: column;
    transform: translateY(105%); transition: transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .screen.open { transform: none; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 16px 4px;
  }
  .topbar h2 { margin: 0; font-size: 21px; text-align: center; }
  .icon-btn {
    border: 0; background: #fff; border-radius: 14px; min-width: 44px; height: 44px;
    font-size: 20px; font-weight: 900; box-shadow: 0 3px 0 rgba(90,58,94,.12); padding: 0 10px;
  }

  /* Dress up */
  .stage {
    flex: 1 1 auto; min-height: 150px; position: relative;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .stage::after {
    content: ""; position: absolute; bottom: 4px; left: 50%; width: 170px; height: 24px;
    transform: translateX(-50%); border-radius: 50%;
    background: radial-gradient(ellipse, rgba(201,167,255,.55), rgba(201,167,255,0) 70%);
  }
  .stage svg { height: 100%; max-height: 420px; width: auto; position: relative; z-index: 1; }
  .bounce { animation: bounce .35s ease; }
  @keyframes bounce { 0%{transform:scale(1)} 40%{transform:scale(1.04,.97)} 100%{transform:scale(1)} }

  .panel {
    flex: none; background: rgba(255,255,255,.88); border-radius: 26px 26px 0 0;
    box-shadow: 0 -6px 18px rgba(90,58,94,.1);
    padding: 10px 0 12px;
  }
  .panel-scroll { max-height: 38vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .tabs {
    display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 10px; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar, .opts::-webkit-scrollbar, .swatches::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 800; font-size: 14px;
    background: #f6eef8;
  }
  .tab.on { background: var(--pink); color: #fff; }
  .opts {
    display: flex; gap: 10px; overflow-x: auto; padding: 2px 16px 10px; scrollbar-width: none;
  }
  .opt {
    flex: none; width: 82px; border: 3px solid transparent; border-radius: 18px; padding: 4px 4px 6px;
    background: #fff; box-shadow: 0 3px 0 rgba(90,58,94,.1); font-size: 12px; font-weight: 800;
    display: flex; flex-direction: column; align-items: center; gap: 2px; line-height: 1.15;
  }
  .opt svg, .opt .thumb { width: 70px; height: 70px; background: #fbf4fc; border-radius: 12px; display: block; }
  .opt.on { border-color: var(--pink); }
  .row-label { font-size: 12px; font-weight: 800; color: var(--ink-soft); padding: 0 18px 4px; }
  .swatches {
    display: flex; gap: 10px; overflow-x: auto; padding: 2px 16px 10px; scrollbar-width: none;
  }
  .sw {
    flex: none; width: 38px; height: 38px; border-radius: 50%; border: 3px solid #fff; padding: 0;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(90,58,94,.15), 0 3px 0 rgba(90,58,94,.12);
  }
  .sw svg { width: 100%; height: 100%; display: block; }
  .sw.on { box-shadow: 0 0 0 3px var(--pink), 0 3px 0 rgba(90,58,94,.12); }

  /* Decorate */
  .room-wrap { flex: none; display: flex; justify-content: center; padding: 6px 12px 10px; perspective: 900px; }
  .compact-frame {
    position: relative; padding: 10px; border-radius: 34px;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,.08), inset 0 6px 10px rgba(255,255,255,.6), 0 10px 22px rgba(90,58,94,.2);
  }
  .room {
    position: relative; width: min(88vw, 430px); aspect-ratio: 10 / 9; overflow: hidden;
    border-radius: 24px; touch-action: none; background: #fff;
  }
  .wall { position: absolute; left: 0; right: 0; top: 0; height: 62%; }
  .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 38%;
    box-shadow: inset 0 10px 14px rgba(0,0,0,.08); }
  .baseboard { position: absolute; left: 0; right: 0; top: 62%; height: 3%; transform: translateY(-100%);
    background: #fff; box-shadow: 0 2px 0 rgba(0,0,0,.06); }
  .item { position: absolute; transform-origin: 50% 100%; }
  .item.k-flat { transform-origin: 50% 50%; }
  .item svg { display: block; width: 100%; height: auto; overflow: visible; pointer-events: none; }
  .item.sel svg { filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 3px var(--pink)); }
  .lid {
    position: absolute; inset: 0; border-radius: 34px; z-index: 5000;
    display: grid; place-items: center; transform-origin: 50% 0;
    box-shadow: inset 0 -10px 0 rgba(0,0,0,.08), inset 0 8px 14px rgba(255,255,255,.7);
  }
  .lid .gem { width: 70px; height: 70px; }
  .lid.opening { animation: lidOpen .8s cubic-bezier(.5,0,.3,1) forwards; }
  @keyframes lidOpen {
    0% { transform: rotateX(0); opacity: 1; }
    70% { opacity: 1; }
    100% { transform: rotateX(-100deg); opacity: 0; visibility: hidden; }
  }
  .deco-panel { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .deco-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .item-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 2px 16px 10px; }
  .item-grid .opt { width: auto; }
  .item-grid .opt svg { width: 100%; height: 62px; padding: 6px; }
  .selbar { padding: 0 0 4px; border-bottom: 2px dashed #f1dbe9; margin-bottom: 8px; }
  .selbtns { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 8px; scrollbar-width: none; }
  .selbtns::-webkit-scrollbar { display: none; }
  .selbtns button {
    flex: none; border: 0; border-radius: 14px; padding: 8px 12px; font-weight: 800; font-size: 13px;
    background: #f6eef8;
  }
  .selbtns .del { background: #ffe1e6; color: #c2185b; }
  .thumb-wall { border: 2px solid #fff; }

  .toast {
    position: fixed; left: 50%; bottom: calc(30px + env(safe-area-inset-bottom)); z-index: 9000;
    transform: translate(-50%, 40px); opacity: 0;
    background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 16px;
    font-weight: 700; transition: .25s; pointer-events: none; max-width: 86vw; text-align: center;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
  .sparkle { position: fixed; z-index: 9100; pointer-events: none; font-size: 18px; animation: pop .8s ease-out forwards; }
  @keyframes pop { from { opacity: 1; transform: translate(-50%,-50%) scale(.6); }
                   to { opacity: 0; transform: translate(-50%,-120%) scale(1.3); } }

  /* ===== Play screen ===== */
  .play-top { display: flex; align-items: center; gap: 10px; padding: 10px 16px 6px; }
  .play-top .lvl { flex: 1; text-align: center; }
  .play-top .lvl b { display: block; font-size: 20px; }
  .play-top .lvl span { font-size: 12px; font-weight: 800; color: var(--ink-soft); }
  .badge-hard { display: inline-block; background: #ffe1e6; color: #c2185b; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 900; }
  .moves-bubble {
    min-width: 62px; height: 62px; border-radius: 50%; background: #fff; display: grid; place-items: center;
    box-shadow: 0 4px 0 rgba(90,58,94,.15); text-align: center; line-height: 1;
  }
  .moves-bubble b { font-size: 24px; display: block; }
  .moves-bubble span { font-size: 10px; font-weight: 800; color: var(--ink-soft); }
  .moves-bubble.low b { color: #e94f6f; animation: pulse .8s infinite; }
  @keyframes pulse { 50% { transform: scale(1.15); } }
  .goals { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; padding: 2px 12px 8px; }
  .goal-chip {
    display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.85); border-radius: 16px;
    padding: 4px 12px 4px 6px; font-weight: 900; font-size: 18px; box-shadow: 0 3px 0 rgba(90,58,94,.1);
  }
  .goal-chip svg, .goal-chip .gi { width: 30px; height: 30px; display: block; }
  .goal-chip.done { background: #d4f7ea; }
  .goal-chip.done b::after { content: " ✓"; color: #2e9e6e; }
  .board-wrap { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 10px; }
  .board {
    position: relative; width: min(94vw, 62vh, 480px); aspect-ratio: 1; touch-action: none;
  }
  .board.shake { animation: shake .4s; }
  @keyframes shake { 20%{transform:translate(-5px,2px)} 40%{transform:translate(5px,-2px)} 60%{transform:translate(-3px,1px)} 80%{transform:translate(3px,0)} }
  .layer { position: absolute; inset: 0; pointer-events: none; }
  .cell { position: absolute; width: 12.5%; height: 12.5%; }
  .cell::before { content: ""; position: absolute; inset: 2%; border-radius: 22%; background: rgba(255,255,255,.55); }
  .cell.glass1::after, .cell.glass2::after {
    content: ""; position: absolute; inset: 4%; border-radius: 20%;
    background: linear-gradient(135deg, rgba(160,220,255,.85), rgba(210,240,255,.55) 50%, rgba(160,220,255,.85));
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.9);
  }
  .cell.glass2::after { background: linear-gradient(135deg, rgba(90,170,240,.9), rgba(150,210,255,.7) 50%, rgba(90,170,240,.9)); }
  .crate { position: absolute; width: 12.5%; height: 12.5%; transition: opacity .25s, transform .25s; }
  .crate svg { width: 100%; height: 100%; display: block; padding: 5%; }
  .crate.gone { opacity: 0; transform: scale(1.3); }
  .tile {
    position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%;
    transition: transform .2s cubic-bezier(.3,0,.35,1.15);
  }
  .tile.noanim { transition: none; }
  .tile svg { width: 100%; height: 100%; display: block; padding: 6%; overflow: visible; }
  .tile.sel svg { animation: selPulse .7s infinite; }
  @keyframes selPulse { 50% { transform: scale(1.12); } }
  .tile.hint svg { animation: hintWiggle 1s infinite; }
  @keyframes hintWiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-12deg) scale(1.08)} 75%{transform:rotate(12deg) scale(1.08)} }
  .tile.pop svg { animation: tilePop .24s ease-in forwards; }
  @keyframes tilePop { 0%{transform:scale(1)} 40%{transform:scale(1.25)} 100%{transform:scale(0);opacity:0} }
  .tile.appear svg { animation: tileAppear .28s ease-out; }
  @keyframes tileAppear { 0%{transform:scale(.2)} 70%{transform:scale(1.2)} 100%{transform:scale(1)} }
  .tile.sp3 svg { animation: bombGlow 1.2s infinite; }
  @keyframes bombGlow { 50% { filter: drop-shadow(0 0 5px #fff); } }
  .tile.sp4 svg { animation: rainSpin 3s linear infinite; }
  @keyframes rainSpin { to { transform: rotate(360deg); } }
  .beam { position: absolute; border-radius: 999px; animation: beam .38s ease-out forwards;
    background: linear-gradient(90deg, rgba(255,255,255,0), #fff 30%, #fff 70%, rgba(255,255,255,0));
    box-shadow: 0 0 14px 4px rgba(255,143,194,.8); }
  .beam.v { background: linear-gradient(180deg, rgba(255,255,255,0), #fff 30%, #fff 70%, rgba(255,255,255,0)); }
  @keyframes beam { 0%{opacity:1; transform:scale(.2,1)} 60%{opacity:1} 100%{opacity:0; transform:scale(1.05,1)} }
  .beam.v { animation-name: beamV; }
  @keyframes beamV { 0%{opacity:1; transform:scale(1,.2)} 60%{opacity:1} 100%{opacity:0; transform:scale(1,1.05)} }
  .burst { position: absolute; border-radius: 50%; animation: burst .45s ease-out forwards;
    background: radial-gradient(circle, #fff 0%, rgba(255,230,120,.9) 35%, rgba(255,143,194,.5) 60%, rgba(255,143,194,0) 72%); }
  @keyframes burst { 0%{transform:scale(.2);opacity:1} 100%{transform:scale(1.25);opacity:0} }
  .rainfx { position: absolute; inset: -4%; border-radius: 24px; animation: rainfx .7s ease-out forwards;
    background: conic-gradient(from 0deg, #ff6b6b55, #ffe66b55, #7be08a55, #6bb8ff55, #b58cff55, #ff6b6b55); }
  @keyframes rainfx { 0%{opacity:0; transform:rotate(0) scale(.8)} 30%{opacity:1} 100%{opacity:0; transform:rotate(90deg) scale(1.1)} }
  .float-text { position: absolute; font-weight: 900; color: #fff; font-size: 22px; pointer-events: none;
    text-shadow: 0 2px 0 #c2185b, 0 0 8px rgba(194,24,91,.6); animation: floatUp 1s ease-out forwards; transform: translate(-50%,-50%); white-space: nowrap; }
  @keyframes floatUp { 0%{opacity:0; transform:translate(-50%,-30%) scale(.6)} 20%{opacity:1; transform:translate(-50%,-50%) scale(1.1)} 100%{opacity:0; transform:translate(-50%,-140%) scale(1)} }
  .boosters { display: flex; justify-content: center; gap: 12px; padding: 8px 16px 14px; }
  .boost {
    position: relative; border: 0; background: #fff; border-radius: 18px; padding: 8px 14px; min-width: 76px;
    font-weight: 800; font-size: 12px; box-shadow: 0 4px 0 rgba(90,58,94,.12); display: flex; flex-direction: column; align-items: center;
  }
  .boost .ico { font-size: 24px; }
  .boost .count { position: absolute; top: -6px; right: -6px; background: var(--pink); color: #fff; border-radius: 999px; min-width: 22px; height: 22px; font-size: 12px; display: grid; place-items: center; padding: 0 5px; }
  .boost.on { background: #ffe1ef; box-shadow: 0 0 0 3px var(--pink); }
  .score-line { text-align: center; font-size: 12px; font-weight: 800; color: var(--ink-soft); margin-top: -4px; }

  /* ===== Modals ===== */
  .modal-back { position: fixed; inset: 0; z-index: 8000; background: rgba(90,58,94,.35); display: grid; place-items: center; padding: 20px;
    animation: fadeIn .2s; }
  @keyframes fadeIn { from { opacity: 0; } }
  .modal {
    width: min(92vw, 380px); background: #fff; border-radius: 28px; padding: 22px 20px 18px; text-align: center;
    box-shadow: 0 12px 30px rgba(90,58,94,.3); animation: modalIn .3s cubic-bezier(.2,.9,.3,1.3);
    max-height: 90vh; overflow-y: auto;
  }
  @keyframes modalIn { from { transform: scale(.7); opacity: 0; } }
  .modal h3 { margin: 0 0 6px; font-size: 26px;
    background: linear-gradient(90deg, var(--pink), var(--lilac)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .modal p { margin: 6px 0 12px; color: var(--ink-soft); font-weight: 700; }
  .modal .goals { padding: 4px 0 10px; }
  .modal .btns { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .mbtn { border: 0; border-radius: 20px; padding: 14px; font-weight: 900; font-size: 18px; background: #f6eef8; }
  .mbtn.main { color: #fff; background: linear-gradient(90deg, var(--pink), var(--lilac)); box-shadow: 0 5px 0 #b77bd6; }
  .mbtn.main:disabled { opacity: .5; }
  .mbtn small { display: block; font-size: 12px; font-weight: 700; opacity: .85; }
  .stars { display: flex; justify-content: center; gap: 6px; margin: 6px 0; }
  .stars span { font-size: 46px; filter: grayscale(1) opacity(.3); transform: scale(.6); transition: .3s cubic-bezier(.2,.9,.3,1.5); }
  .stars span.on { filter: none; transform: scale(1); }
  .stars span:nth-child(2) { margin-top: -14px; }
  .pre-boosts { display: flex; justify-content: center; gap: 10px; margin-top: 4px; }
  .pre-boosts .boost { min-width: 84px; }
  .spinner { width: 36px; height: 36px; border-radius: 50%; border: 5px solid #f6eef8; border-top-color: var(--pink); margin: 10px auto; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .coin-reward { font-size: 24px; font-weight: 900; color: #c9932a; }
  .tip-art { font-size: 54px; margin: 4px 0; }
  .lock-tag {
    position: absolute; top: 4px; right: 4px; background: rgba(90,58,94,.85); color: #fff; border-radius: 999px;
    font-size: 11px; font-weight: 900; padding: 2px 7px 2px 5px; display: flex; align-items: center; gap: 3px;
  }
  .lock-tag i { width: 12px; height: 12px; border-radius: 50%; display: inline-block;

<script>
// =========================================================
// Helpers

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = (v) => Math.max(0, Math.min(255, Math.round(v + amt * 255)));
  const r = f(n >> 16), g = f((n >> 8) & 255), b = f(n & 255);
  return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
function lum(hex) {
  const n = parseInt(hex.slice(1), 16);
  return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// =========================================================

const SAVE_KEY = "jpw_save_v1";
function migrateDoll(d) {

function load() {

// =========================================================

function patternDef(id, idx, c) {
  const light = lum(c) > 0.72;
  const a = light ? shade(c, -0.28) : "#ffffff";
  const op = light ? 1 : 0.75;
  const P = (w, h, inner) =>
    `<pattern id="${id}" patternUnits="userSpaceOnUse" width="${w}" height="${h}"><rect width="${w}" height="${h}" fill="${c}"/>${inner}</pattern>`;
  switch (idx) {

    case 3: return P(12, 12, `<path d="M6 9 L3 6 A1.7 1.7 0 0 1 6 3.8 A1.7 1.7 0 0 1 9 6 Z" fill="${light ? "#ff5fa2" : a}" opacity="${op}"/>`);

    case 6: return P(10, 10, `<rect width="5" height="5" fill="${a}" opacity=".55"/><rect x="5" y="5" width="5" height="5" fill="${a}" opacity=".55"/>`);
    case 7: return P(14, 14, `<g fill="${light ? "#ff8fc2" : "#fff"}"><circle cx="7" cy="4.6" r="1.6"/><circle cx="9.4" cy="7" r="1.6"/><circle cx="7" cy="9.4" r="1.6"/><circle cx="4.6" cy="7" r="1.6"/></g><circle cx="7" cy="7" r="1.2" fill="#ffcf5a"/>`);
    case 8: return P(16, 16, `<g fill="${shade(c, -0.12)}" stroke="${shade(c, -0.45)}" stroke-width="1"><ellipse cx="4" cy="4" rx="2.4" ry="1.8"/><ellipse cx="12" cy="9" rx="2" ry="2.4"/><ellipse cx="5" cy="13" rx="2.2" ry="1.6"/></g>`);
    case 9: return P(12, 12, `<circle cx="2" cy="3" r=".7" fill="#fff"/><circle cx="8" cy="2" r=".5" fill="#fff"/><circle cx="5" cy="7" r=".8" fill="#fff" opacity=".8"/><circle cx="10" cy="9" r=".6" fill="#ffcf5a"/><circle cx="3" cy="10.5" r=".5" fill="#fff"/>`);
    case 10: return `<pattern id="${id}" patternUnits="userSpaceOnUse" width="10" height="18">` +
      ["#ff6b6b", "#ffb36b", "#ffe66b", "#7be08a", "#6bb8ff", "#b58cff"].map((col, i) =>
        `<rect y="${i * 3}" width="10" height="3" fill="${col}"/>`).join("") + `</pattern>`;
  }
  return "";
}
function paint(c, idx, id) {
  if (!idx) return { def: "", f: c };
  return { def: patternDef(id, idx, c), f: `url(#${id})` };

function hairFront(style, c) {

function setDoll(key, val, clearsDress) {

  state.doll[key] = val;
  if (clearsDress) state.doll.dress = 0;
  save(); drawDolls(true);
  const body = document.getElementById("panelBody");
  const top = body.scrollTop;
  const scrolls = [...body.querySelectorAll(".opts, .swatches")].map(e => e.scrollLeft);
  renderPanel();

  body.querySelectorAll(".opts, .swatches").forEach((e, i) => e.scrollLeft = scrolls[i] || 0);
}

    const ok = list.map((_, i) => i).filter(i => ownsStyle(key, i) && (p === undefined || i > 0));
    if (p !== undefined && (Math.random() >= p || !ok.length)) return 0;
    return ok.length ? ok[r(ok.length)] : 0;

function svgUrl(s) { return `url("data:image/svg+xml,${encodeURIComponent(s)}")`; }
function wallCss(p, c) {
  const a = lum(c) > .72 ? shade(c, -.1) : shade(c, .1);
  switch (p) {
    case 1: return `repeating-linear-gradient(90deg, ${c} 0 16px, ${a} 16px 32px)`;
    case 2: return `radial-gradient(${a} 3.5px, transparent 4px) 0 0 / 24px 24px, ${c}`;
    case 3: return `${svgUrl(`<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34"><path d="M17 24 L11 18 A3.5 3.5 0 0 1 17 12.5 A3.5 3.5 0 0 1 23 18 Z" fill="${a}"/></svg>`)} 0 0 / 34px 34px, ${c}`;
    case 4: return `${svgUrl(`<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36"><path d="M18 9 L20 15 L26 15.5 L21.5 19.5 L23 25.5 L18 22 L13 25.5 L14.5 19.5 L10 15.5 L16 15 Z" fill="${a}"/></svg>`)} 0 0 / 36px 36px, ${c}`;
    case 5: return `repeating-linear-gradient(0deg, transparent 0 18px, ${a}88 18px 26px), repeating-linear-gradient(90deg, transparent 0 18px, ${a}88 18px 26px), ${c}`;
  }
  return c;
}
function floorCss(p, c) {
  const d = shade(c, -.1), l = shade(c, .08);
  switch (p) {
    case 0: return `repeating-linear-gradient(180deg, ${c} 0 16px, ${d} 16px 18px)`;
    case 1: return `radial-gradient(${l} 1px, transparent 1.5px) 0 0 / 6px 6px, ${c}`;
    case 2: return `linear-gradient(90deg, rgba(255,255,255,.6) 2px, transparent 2px) 0 0 / 34px 34px, linear-gradient(rgba(255,255,255,.6) 2px, transparent 2px) 0 0 / 34px 34px, ${c}`;
    case 3: return `conic-gradient(${c} 25%, ${l} 0 50%, ${c} 0 75%, ${l} 0) 0 0 / 40px 40px`;
    case 4: return `radial-gradient(circle at 30% 30%, ${l} 3px, transparent 4px) 0 0 / 12px 12px, radial-gradient(circle at 70% 70%, ${d} 3px, transparent 4px) 0 0 / 12px 12px, ${c}`;
  }
  return c;
}

// Rooms: one per compact. Positions are % of the room (x = center, y = bottom edge).
const MAX_ITEMS = 40;
function defaultRoom(i) {
  if (typeof THEME_ROOMS !== "undefined" && THEME_ROOMS[i]) {
    const t = THEME_ROOMS[i];
    return { wall: { ...t.wall }, floor: { ...t.floor },
             items: t.items.map(it => ({ s: 1, f: 0, c: ITEMS[it.t].c, ...it })) };
  }
  return {
    wall: { p: 1, c: 10 }, floor: { p: 0, c: 18 },
    items: [
      { t: "window", x: 32, y: 40, s: 1, f: 0, c: 6 },
      { t: "lights", x: 50, y: 14, s: 1, f: 0, c: 0 },
      { t: "rug", x: 50, y: 90, s: 1, f: 0, c: 10 },
      { t: "nightstand", x: 13, y: 82, s: 1, f: 0, c: 19 },
      { t: "lamp", x: 13, y: 69.5, s: 1, f: 0, c: 4 },
      { t: "bed", x: 55, y: 86, s: 1, f: 1, c: 0 },
      { t: "doll", x: 84, y: 97, s: 1, f: 0, c: 0 },
    ],
  };
}
let roomIdx = 0, sel = -1, decoTab = 0, drag = null;
const room = () => state.rooms[roomIdx];

function itemSvg(it) {
  const def = ITEMS[it.t];
  const c = C(it.c ?? def.c);
  const [w, h] = def.vb;
  return `<svg viewBox="${def.vbX || 0} ${def.vbY || 0} ${w} ${h}" width="${w}" height="${h}" style="aspect-ratio:${w}/${h}">${def.svg(c)}${def.extra ? def.extra(c) : ""}</svg>`;
}
function placeItem(el, it) {
  const def = ITEMS[it.t];
  el.style.left = it.x + "%";
  el.style.top = it.y + "%";
  el.style.width = def.w + "%";
  const flip = it.f ? " scaleX(-1)" : "";
  el.style.transform = def.kind === "flat"
    ? `translate(-50%,-50%) scale(${it.s})${flip}`
    : `translate(-50%,-100%) scale(${it.s})${flip}`;
}
function renderRoom() {
  const r = room();
  document.getElementById("roomWall").style.background = wallCss(r.wall.p, C(r.wall.c));
  document.getElementById("roomFloor").style.background = floorCss(r.floor.p, C(r.floor.c));
  const holder = document.getElementById("roomItems");
  holder.innerHTML = "";
  r.items.forEach((it, i) => {
    const def = ITEMS[it.t];
    if (!def) return;
    const el = document.createElement("div");
    el.className = "item k-" + def.kind + (i === sel ? " sel" : "");
    el.dataset.i = i;
    el.innerHTML = itemSvg(it);
    const band = def.kind === "wall" ? 0 : def.kind === "flat" ? 1 : 2;
    el.style.zIndex = band * 1000 + i + 1;
    placeItem(el, it);
    holder.appendChild(el);
  });
  renderSelBar();
}
function renderSelBar() {
  const bar = document.getElementById("selBar");
  const it = room().items[sel];
  if (!it) { bar.classList.add("hidden"); return; }
  bar.classList.remove("hidden");
  const colors = document.getElementById("selColors");
  colors.innerHTML = "";
  if (ITEMS[it.t].noColor) return;
  CLOTH_COLORS.forEach((col, i) => {
    const b = document.createElement("button");
    b.className = "sw" + ((it.c ?? ITEMS[it.t].c) === i ? " on" : "");
    b.style.background = col;
    b.onclick = () => { it.c = i; save(); renderRoom(); };
    colors.appendChild(b);
  });
}
function renderDecoTabs() {
  const tabs = document.getElementById("decoTabs");
  tabs.innerHTML = "";
  DECO_TABS.forEach((name, i) => {

function renderDecoBody() {
  const body = document.getElementById("decoBody");
  body.innerHTML = "";
  const r = room();
  if (decoTab <= 2) {
    const grid = document.createElement("div");
    grid.className = "item-grid";
    Object.entries(ITEMS).filter(([, d]) => d.tab === decoTab && (!d.room || compactUnlocked(d.room))).forEach(([key, d]) => {
      const b = document.createElement("button");
      const owned = ownsItem(key);
      b.className = "opt" + (owned ? "" : " locked");
      b.innerHTML = itemSvg({ t: key, c: d.c }) + d.name + (owned ? "" : lockTag(itemPrice(key)));
      b.onclick = () => owned ? addItem(key) : buyThing("item:" + key, d.name, itemPrice(key), () => { renderDecoBody(); addItem(key); });
      grid.appendChild(b);
    });
    body.appendChild(grid);
    return;
  }
  const isWall = decoTab === 3;
  const cfg = isWall ? r.wall : r.floor;
  const names = isWall ? WALL_PATTERNS : FLOORS;
  const cssFn = isWall ? wallCss : floorCss;
  const lab1 = document.createElement("div"); lab1.className = "row-label"; lab1.textContent = isWall ? "Wallpaper" : "Floor";
  const opts = document.createElement("div"); opts.className = "opts";
  names.forEach((n, i) => {
    const b = document.createElement("button");
    const kind = isWall ? "wall" : "floor";
    const owned = ownsSurface(kind, i);
    b.className = "opt" + (cfg.p === i ? " on" : "") + (owned ? "" : " locked");
    b.innerHTML = `<div class="thumb"></div>${n}` + (owned ? "" : lockTag(surfacePrice(kind, i)));
    b.firstChild.style.background = cssFn(i, C(cfg.c));
    const apply = () => { cfg.p = i; save(); renderRoom(); renderDecoBody(); };
    b.onclick = () => owned ? apply() : buyThing(kind + ":" + i, n + (isWall ? " wallpaper" : " floor"), surfacePrice(kind, i), apply);
    opts.appendChild(b);
  });
  const lab2 = document.createElement("div"); lab2.className = "row-label"; lab2.textContent = "Color";
  const sw = document.createElement("div"); sw.className = "swatches";
  CLOTH_COLORS.forEach((col, i) => {
    const b = document.createElement("button");
    b.className = "sw" + (cfg.c === i ? " on" : "");
    b.style.background = col;
    b.onclick = () => { cfg.c = i; save(); renderRoom(); renderDecoBody(); };
    sw.appendChild(b);
  });
  body.append(lab1, opts, lab2, sw);
}
function addItem(key) {
  const r = room();
  if (r.items.length >= MAX_ITEMS) { toast("This room is full! Remove something first 💕"); return; }
  if (key === "doll" && r.items.some(it => it.t === "doll")) { toast("Your doll is already in this room ✨"); return; }
  const def = ITEMS[key];
  const y = def.kind === "wall" ? 40 : def.kind === "flat" ? 88 : 92;
  r.items.push({ t: key, x: 40 + Math.random() * 20, y, s: 1, f: 0, c: def.c });
  sel = r.items.length - 1;
  save(); renderRoom();
}
function selAction(act) {
  const r = room(), it = r.items[sel];
  if (!it) return;
  switch (act) {
    case "smaller": it.s = Math.max(0.4, +(it.s - 0.15).toFixed(2)); break;
    case "bigger": it.s = Math.min(2.5, +(it.s + 0.15).toFixed(2)); break;
    case "flip": it.f = it.f ? 0 : 1; break;
    case "front": r.items.push(r.items.splice(sel, 1)[0]); sel = r.items.length - 1; break;
    case "back": r.items.unshift(r.items.splice(sel, 1)[0]); sel = 0; break;
    case "del": r.items.splice(sel, 1); sel = -1; break;
  }
  save(); renderRoom();
}
document.querySelectorAll("#selBar [data-act]").forEach(b => b.onclick = () => selAction(b.dataset.act));

// Dragging items around the room
const roomEl = document.getElementById("room");
roomEl.addEventListener("pointerdown", (e) => {
  const el = e.target.closest(".item");
  if (!el) { if (sel !== -1) { sel = -1; renderRoom(); } return; }
  const i = +el.dataset.i;
  if (sel !== i) { sel = i; renderRoom(); }
  const it = room().items[i];
  drag = { i, x0: e.clientX, y0: e.clientY, ix: it.x, iy: it.y, moved: false };
  roomEl.setPointerCapture(e.pointerId);
  e.preventDefault();
});
roomEl.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const rect = roomEl.getBoundingClientRect();
  const it = room().items[drag.i];
  const kind = ITEMS[it.t].kind;
  it.x = clamp(drag.ix + (e.clientX - drag.x0) / rect.width * 100, 0, 100);
  const [lo, hi] = kind === "wall" ? [6, 62] : kind === "flat" ? [62, 100] : [58, 102];
  it.y = clamp(drag.iy + (e.clientY - drag.y0) / rect.height * 100, lo, hi);
  drag.moved = true;
  const el = document.querySelector(`#roomItems .item[data-i="${drag.i}"]`);
  if (el) placeItem(el, it);
});
const endDrag = () => { if (drag && drag.moved) save(); drag = null; };
roomEl.addEventListener("pointerup", endDrag);
roomEl.addEventListener("pointercancel", endDrag);

function openRoom(i) {
  roomIdx = i; sel = -1;
  if (!state.rooms[i]) { state.rooms[i] = defaultRoom(i); save(); }
  const c = COMPACTS[i];
  document.getElementById("roomTitle").textContent = c.name;
  const grad = `radial-gradient(circle at 35% 30%, ${c.colors[0]}, ${c.colors[1]})`;
  document.getElementById("compactFrame").style.background = grad;
  const lid = document.getElementById("lid");
  lid.style.background = grad;
  lid.classList.remove("opening");
  renderRoom(); renderDecoTabs(); renderDecoBody();
  document.getElementById("decoScreen").classList.add("open");
  setTimeout(() => { void lid.offsetWidth; lid.classList.add("opening"); }, 380);
}
const closeRoom = () => { sel = -1; document.getElementById("decoScreen").classList.remove("open"); };
document.getElementById("decoBtn").onclick = () => openRoom(0);

const LEVELS_PER_COMPACT = 100;

function renderShelf() {
  const shelf = document.getElementById("shelf");

    const unlockAt = i * LEVELS_PER_COMPACT + 1;

    btn.className = "compact" + (unlocked ? "" : " locked");
    btn.innerHTML = `
      <div class="shell" style="background: radial-gradient(circle at 35% 30%, ${c.colors[0]}, ${c.colors[1]})">

    btn.onclick = (e) => {

    };
    shelf.appendChild(btn);

}

  if (state.lastGift === today) { toast("Come back tomorrow for another gift 💕"); return; }
  const amount = 50 + Math.floor(Math.random() * 51);
  state.coins += amount; state.lastGift = today; save(); renderHud();
  sparkle(e.clientX, e.clientY);
  toast("Daily gift: +" + amount + " coins!");
};
document.getElementById("playBtn").onclick = (e) => { sparkle(e.clientX, e.clientY); toast("Puzzles are coming soon 🧩"); };
document.querySelectorAll("[data-soon]").forEach(b => b.onclick = (e) => {
  sparkle(e.clientX, e.clientY);
  toast(b.dataset.soon + " is coming soon ✨");
});

// =========================================================
// Little effects
// =========================================================
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2000);
}
function sparkle(x, y) {
  ["✨", "💖", "⭐"].forEach((s, i) => {
    const el = document.createElement("div");
    el.className = "sparkle"; el.textContent = s;
    el.style.left = (x + (i - 1) * 22) + "px"; el.style.top = y + "px";
    document.body.appendChild(el); setTimeout(() => el.remove(), 800);
  });
}

save(); // writes migrated save format
renderShelf(); renderHud(); drawDolls(false);

<script>
// =========================================================
// PUZZLE ENGINE (pure logic, no DOM). Board is N x N, cells indexed r*N+c.
// Tiles: { id, color, sp }  color 0..5 normal, -1 charm, -2 rainbow
// sp: 0 none, 1 ribbon (row), 2 ribbon (column), 3 glitter bomb, 4 rainbow
// =========================================================
const N = 8;
const SP_NONE = 0, SP_RH = 1, SP_RV = 2, SP_BOMB = 3, SP_RAIN = 4;
const CHARM = -1, RAINBOW = -2;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashInt(n) {
  let h = (2166136261 ^ n) >>> 0;
  h = Math.imul(h ^ (h >>> 16), 2246822507);
  h = Math.imul(h ^ (h >>> 13), 3266489909);
  return (h ^ (h >>> 16)) >>> 0;
}

class Engine {
  // cfg: { colors, mask[64], glass[64], crate[64], goals:[{type, color?, amount}], moves, charmStart }
  constructor(cfg, rng, record) {
    this.cfg = cfg;
    this.rng = rng;
    this.record = !!record;
    this.events = [];
    this.nextId = 1;
    this.mask = cfg.mask.slice();
    this.glass = cfg.glass.slice();
    this.crate = cfg.crate.slice();
    this.tiles = new Array(N * N).fill(null);
    this.score = 0;
    this.movesLeft = cfg.moves;
    this.movesUsed = 0;
    this.goals = cfg.goals.map(g => ({ ...g, left: g.amount }));
    this.charmsSpawned = 0;
    this.initialFill();
  }

  // ---------- helpers ----------
  playable(i) { return this.mask[i] && !this.crate[i]; }
  rc(i) { return [Math.floor(i / N), i % N]; }
  goal(type) { return this.goals.find(g => g.type === type); }
  randColor() { return Math.floor(this.rng() * this.cfg.colors); }
  newTile(color, sp = 0) { return { id: this.nextId++, color, sp }; }
  isWon() { return this.goals.every(g => g.left <= 0); }
  charmGoal() { const g = this.goal("charm"); return g && g.left > 0 ? g : null; }
  charmsOnBoard() { return this.tiles.filter(t => t && t.color === CHARM).length; }

  clone() {
    const e = Object.create(Engine.prototype);
    e.cfg = this.cfg; e.rng = this.rng; e.record = false; e.events = [];
    e.nextId = this.nextId;
    e.mask = this.mask; // never changes
    e.glass = this.glass.slice(); e.crate = this.crate.slice();
    e.tiles = this.tiles.map(t => t && { id: t.id, color: t.color, sp: t.sp });
    e.score = this.score; e.movesLeft = this.movesLeft; e.movesUsed = this.movesUsed;
    e.goals = this.goals.map(g => ({ ...g }));
    e.charmsSpawned = this.charmsSpawned;
    return e;
  }

  snapshot() {
    const tiles = [];
    this.tiles.forEach((t, i) => { if (t) tiles.push([t.id, i, t.color, t.sp]); });
    return { tiles, glass: this.glass.slice(), crate: this.crate.slice(), score: this.score,
             goals: this.goals.map(g => g.left), movesLeft: this.movesLeft };
  }
  emit(kind, extra) {
    if (!this.record) return;
    this.events.push({ kind, snap: this.snapshot(), ...(extra || {}) });
  }
  takeEvents() { const e = this.events; this.events = []; return e; }

  // ---------- initial fill ----------
  initialFill() {
    for (let attempt = 0; attempt < 60; attempt++) {
      for (let i = 0; i < N * N; i++) {
        this.tiles[i] = null;
        if (!this.playable(i)) continue;
        const [r, c] = this.rc(i);
        let color, tries = 0;
        do {
          color = this.randColor(); tries++;
        } while (tries < 20 && (
          (c >= 2 && this.colorAt(r, c - 1) === color && this.colorAt(r, c - 2) === color) ||
          (r >= 2 && this.colorAt(r - 1, c) === color && this.colorAt(r - 2, c) === color)));
        this.tiles[i] = this.newTile(color);
      }
      // starting charms sit in the top playable cell of random columns
      const cg = this.charmGoal();
      if (cg) {
        const want = Math.min(this.cfg.charmStart || 1, cg.amount);
        const cols = [2, 3, 4, 5].sort(() => this.rng() - 0.5);
        let placed = 0;
        for (const c of cols) {
          if (placed >= want) break;
          for (let r = 3; r < N; r++) {
            const i = r * N + c;
            if (this.playable(i)) {
              // don't drop a charm right onto the bottom
              if (this.bottomOf(c) !== i) { this.tiles[i] = this.newTile(CHARM); placed++; this.charmsSpawned++; }
              break;
            }
          }
        }
      }
      if (this.findMatches().length === 0 && this.findMoves(1).length > 0) return;
      this.charmsSpawned = 0;
    }
  }
  colorAt(r, c) { const t = this.tiles[r * N + c]; return t ? t.color : null; }
  bottomOf(c) {
    for (let r = N - 1; r >= 0; r--) { const i = r * N + c; if (this.playable(i)) return i; }
    return -1;
  }

  // ---------- matching ----------
  findMatches() {
    const runs = [];
    const scan = (horizontal) => {
      for (let a = 0; a < N; a++) {
        let start = 0;
        for (let b = 1; b <= N; b++) {
          const i0 = horizontal ? a * N + start : start * N + a;
          const ib = horizontal ? a * N + b : b * N + a;
          const t0 = this.tiles[i0], tb = b < N ? this.tiles[ib] : null;
          const same = tb && t0 && t0.color >= 0 && tb.color === t0.color;
          if (!same) {
            const len = b - start;
            if (t0 && t0.color >= 0 && len >= 3) {
              const cells = [];
              for (let k = start; k < b; k++) cells.push(horizontal ? a * N + k : k * N + a);
              runs.push({ cells, horizontal, color: t0.color });
            }
            start = b;
          }
        }
      }
    };
    scan(true); scan(false);
    if (!runs.length) return [];
    // merge runs that share cells into groups
    const groups = [];
    const cellGroup = new Map();
    for (const run of runs) {
      let g = null;
      for (const i of run.cells) if (cellGroup.has(i)) { g = cellGroup.get(i); break; }
      if (!g) { g = { cells: new Set(), runs: [], color: run.color }; groups.push(g); }
      g.runs.push(run);
      run.cells.forEach(i => { g.cells.add(i); cellGroup.set(i, g); });
    }
    return groups;
  }
  // special created by a match group, and where
  specialFor(g, prefer) {
    const maxLen = Math.max(...g.runs.map(r => r.cells.length));
    const hasH = g.runs.some(r => r.horizontal), hasV = g.runs.some(r => !r.horizontal);
    let sp = 0;
    if (maxLen >= 5) sp = SP_RAIN;
    else if (hasH && hasV) sp = SP_BOMB;
    else if (maxLen === 4) sp = g.runs[0].horizontal ? SP_RH : SP_RV;
    if (!sp) return null;
    let pos = null;
    if (prefer) for (const p of prefer) if (g.cells.has(p)) { pos = p; break; }
    if (pos === null) {
      if (sp === SP_BOMB) {
        // the crossing cell
        const counts = new Map();
        g.runs.forEach(r => r.cells.forEach(i => counts.set(i, (counts.get(i) || 0) + 1)));
        for (const [i, n] of counts) if (n > 1) { pos = i; break; }
      }
      if (pos === null) {
        const longest = g.runs.reduce((a, b) => (b.cells.length > a.cells.length ? b : a));
        pos = longest.cells[Math.floor(longest.cells.length / 2)];
      }
    }
    return { pos, sp, color: sp === SP_RAIN ? RAINBOW : g.color };
  }
  matchAt(i) {
    const t = this.tiles[i];
    if (!t || t.color < 0) return false;
    const [r, c] = this.rc(i);
    let h = 1, v = 1;
    for (let k = c - 1; k >= 0 && this.colorAt(r, k) === t.color; k--) h++;
    for (let k = c + 1; k < N && this.colorAt(r, k) === t.color; k++) h++;
    for (let k = r - 1; k >= 0 && this.colorAt(k, c) === t.color; k--) v++;
    for (let k = r + 1; k < N && this.colorAt(k, c) === t.color; k++) v++;
    return h >= 3 || v >= 3;
  }
  // list of valid swaps [a, b]; stop after `limit`
  findMoves(limit = 999) {
    const out = [];
    for (let i = 0; i < N * N && out.length < limit; i++) {
      const ti = this.tiles[i];
      if (!ti) continue;
      const [r, c] = this.rc(i);
      for (const j of [c < N - 1 ? i + 1 : -1, r < N - 1 ? i + N : -1]) {
        if (j < 0) continue;
        const tj = this.tiles[j];
        if (!tj) continue;
        if (ti.sp === SP_RAIN || tj.sp === SP_RAIN || (ti.sp && tj.sp)) { out.push([i, j]); continue; }
        this.tiles[i] = tj; this.tiles[j] = ti;
        const ok = this.matchAt(i) || this.matchAt(j);
        this.tiles[i] = ti; this.tiles[j] = tj;
        if (ok) out.push([i, j]);
      }
    }
    return out;
  }

  // ---------- areas ----------
  rowCells(r) { const a = []; for (let c = 0; c < N; c++) if (this.mask[r * N + c]) a.push(r * N + c); return a; }
  colCells(c) { const a = []; for (let r = 0; r < N; r++) if (this.mask[r * N + c]) a.push(r * N + c); return a; }
  square(i, rad) {
    const [r, c] = this.rc(i), a = [];
    for (let y = r - rad; y <= r + rad; y++) for (let x = c - rad; x <= c + rad; x++)
      if (y >= 0 && y < N && x >= 0 && x < N && this.mask[y * N + x]) a.push(y * N + x);
    return a;
  }
  mostCommonColor() {
    const n = new Array(6).fill(0);
    this.tiles.forEach(t => { if (t && t.color >= 0) n[t.color]++; });
    let best = 0; n.forEach((v, k) => { if (v > n[best]) best = k; });
    return best;
  }
  cellsOfColor(color) { const a = []; this.tiles.forEach((t, i) => { if (t && t.color === color) a.push(i); }); return a; }
  specialArea(i, t) {
    const [r, c] = this.rc(i);
    switch (t.sp) {
      case SP_RH: return this.rowCells(r);
      case SP_RV: return this.colCells(c);
      case SP_BOMB: return this.square(i, 1);
      case SP_RAIN: return this.cellsOfColor(this.mostCommonColor());
    }
    return [];
  }

  // ---------- clearing ----------
  // matchCells: cells cleared by a match (they damage neighbouring gift boxes)
  // extraCells: cells hit directly (combos, hammer)
  clearCells(matchCells, extraCells, creates, cascade) {
    const hit = new Set([...matchCells, ...extraCells]);
    const queue = [...hit];
    const fx = [];
    const fired = new Set();
    const crateHits = new Set();
    while (queue.length) {
      const i = queue.pop();
      const t = this.tiles[i];
      if (!t || !t.sp || fired.has(t.id)) continue;
      fired.add(t.id);
      fx.push({ sp: t.sp, i });
      for (const j of this.specialArea(i, t)) {
        if (this.crate[j]) crateHits.add(j);
        if (!hit.has(j)) { hit.add(j); queue.push(j); }
      }
      if (t.sp === SP_BOMB) this.score += 200;
      if (t.sp === SP_RH || t.sp === SP_RV) this.score += 120;
    }
    // gift boxes next to matched cells
    for (const i of matchCells) {
      const [r, c] = this.rc(i);
      for (const [y, x] of [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]]) {
        if (y >= 0 && y < N && x >= 0 && x < N && this.crate[y * N + x]) crateHits.add(y * N + x);
      }
    }
    for (const i of extraCells) if (this.crate[i]) crateHits.add(i);

    const collect = this.goals.filter(g => g.type === "collect");
    const glassGoal = this.goal("glass"), crateGoal = this.goal("crate");
    const cleared = [];
    for (const i of hit) {
      const t = this.tiles[i];
      if (t && t.color !== CHARM) {
        cleared.push(i);
        for (const g of collect) if (g.color === t.color && g.left > 0) g.left--;
        this.tiles[i] = null;
        this.score += 20 + 40 * cascade;
        if (this.glass[i] > 0) {
          this.glass[i]--;
          if (this.glass[i] === 0 && glassGoal && glassGoal.left > 0) glassGoal.left--;
        }
      }
    }
    for (const i of crateHits) {
      if (!this.crate[i]) continue;
      this.crate[i]--;
      this.score += 50;
      if (this.crate[i] === 0 && crateGoal && crateGoal.left > 0) crateGoal.left--;
    }
    for (const cr of creates) {
      if (this.playable(cr.pos)) this.tiles[cr.pos] = this.newTile(cr.color, cr.sp);
    }
    this.updateScoreGoal();
    this.emit("clear", { fx, cleared, cascade });
    return cleared.length;
  }
  updateScoreGoal() {
    const g = this.goal("score");
    if (g) g.left = Math.max(0, g.amount - this.score);
  }

  // ---------- gravity & refill ----------
  spawnTile(c) {
    const cg = this.charmGoal();
    if (cg && c >= 2 && c <= 5 && this.charmsSpawned < cg.amount && this.charmsOnBoard() < 2 && this.rng() < 0.4) {
      this.charmsSpawned++;
      return this.newTile(CHARM);
    }
    return this.newTile(this.randColor());
  }
  gravity() {
    let any = false;
    for (let c = 0; c < N; c++) {
      const cells = [];
      for (let r = N - 1; r >= 0; r--) { const i = r * N + c; if (this.playable(i)) cells.push(i); }
      const col = cells.map(i => this.tiles[i]).filter(Boolean);
      if (col.length === cells.length) continue;
      any = true;
      cells.forEach((i, k) => { this.tiles[i] = col[k] || null; });
      for (let k = col.length; k < cells.length; k++) this.tiles[cells[k]] = this.spawnTile(c);
    }
    if (any) this.emit("fall");
    return any;
  }
  // charms that reach the bottom are collected
  collectCharms() {
    const g = this.goal("charm");
    if (!g) return false;
    const got = [];
    for (let c = 0; c < N; c++) {
      const i = this.bottomOf(c);
      if (i >= 0 && this.tiles[i] && this.tiles[i].color === CHARM) {
        this.tiles[i] = null; got.push(i);
        if (g.left > 0) g.left--;
        this.score += 500;
      }
    }
    if (got.length) { this.updateScoreGoal(); this.emit("charm", { cells: got }); }
    return got.length > 0;
  }

  // keep resolving until the board is stable
  resolve(prefer) {
    let cascade = 0;
    for (let guard = 0; guard < 60; guard++) {
      if (this.collectCharms()) { this.gravity(); continue; }
      const groups = this.findMatches();
      if (!groups.length) break;
      cascade++;
      const matchCells = new Set();
      const creates = [];
      for (const g of groups) {
        g.cells.forEach(i => matchCells.add(i));
        const s = this.specialFor(g, prefer);
        if (s) creates.push(s);
      }
      // a special created here must not be destroyed by its own match
      this.clearCells(matchCells, [], creates, cascade);
      prefer = null;
      this.gravity();
    }
    return cascade;
  }

  // after each player action: shuffle if stuck
  settle() {
    if (this.findMoves(1).length === 0) this.shuffle();
  }
  shuffle() {
    const cells = [], pool = [];
    this.tiles.forEach((t, i) => { if (t && t.color >= 0 && !t.sp) { cells.push(i); pool.push(t); } });
    for (let attempt = 0; attempt < 80; attempt++) {
      for (let k = pool.length - 1; k > 0; k--) {
        const j = Math.floor(this.rng() * (k + 1)); [pool[k], pool[j]] = [pool[j], pool[k]];
      }
      cells.forEach((i, k) => { this.tiles[i] = pool[k]; });
      if (this.findMatches().length === 0 && this.findMoves(1).length > 0) break;
      if (attempt > 40) { // recolor if shuffling alone can't work
        pool.forEach(t => { t.color = this.randColor(); });
      }
    }
    this.emit("shuffle");
  }

  // ---------- player actions ----------
  adjacent(a, b) {
    const [ra, ca] = this.rc(a), [rb, cb] = this.rc(b);
    return Math.abs(ra - rb) + Math.abs(ca - cb) === 1;
  }
  // returns true if the move was used
  trySwap(a, b) {
    if (!this.adjacent(a, b)) return false;
    const ta = this.tiles[a], tb = this.tiles[b];
    if (!ta || !tb || this.movesLeft <= 0) return false;
    this.tiles[a] = tb; this.tiles[b] = ta;
    this.emit("swap", { a, b });
    const isCombo = ta.sp === SP_RAIN || tb.sp === SP_RAIN || (ta.sp && tb.sp);
    if (!isCombo && this.findMatches().length === 0) {
      this.tiles[a] = ta; this.tiles[b] = tb;
      this.emit("swapBack", { a, b });
      return false;
    }
    this.movesLeft--; this.movesUsed++;
    if (isCombo) {
      this.combo(a, b, tb, ta); // tb now at a, ta now at b
      this.gravity();
      this.resolve(null);
    } else {
      this.resolve([b, a]);
    }
    if (this.sinkCharms()) this.resolve(null);
    this.settle();
    return true;
  }
  // every move, each charm sinks one row (swapping with the tile below it)
  sinkCharms() {
    if (!this.charmGoal() || this.movesUsed % 2) return false;
    let moved = false;
    for (let r = N - 2; r >= 0; r--) for (let c = 0; c < N; c++) {
      const i = r * N + c;
      const t = this.tiles[i];
      if (!t || t.color !== CHARM) continue;
      let j = i + N;
      while (j < N * N && !this.playable(j)) j += N; // skip holes and gift boxes
      if (j >= N * N || !this.tiles[j] || this.tiles[j].color === CHARM) continue;
      this.tiles[i] = this.tiles[j]; this.tiles[j] = t; moved = true;
    }
    if (moved) this.emit("fall");
    return moved;
  }
  // x at cell a, y at cell b (y is the tile the player dragged)
  combo(a, b, x, y) {
    const R = (t) => t.sp === SP_RAIN, RIB = (t) => t.sp === SP_RH || t.sp === SP_RV, BOMB = (t) => t.sp === SP_BOMB;
    let extra = [];
    const fxBig = [];
    if (R(x) && R(y)) {
      this.tiles.forEach((t, i) => { if (t) extra.push(i); });
      x.sp = y.sp = 0; fxBig.push("rainbow2");
      this.score += 2000;
    } else if (R(x) || R(y)) {
      const rain = R(x) ? x : y, other = R(x) ? y : x;
      const rainCell = R(x) ? a : b;
      rain.sp = 0;
      const targets = other.color >= 0 ? this.cellsOfColor(other.color) : [];
      if (RIB(other) || BOMB(other)) {
        targets.forEach(i => {
          const t = this.tiles[i];
          t.sp = BOMB(other) ? SP_BOMB : (this.rng() < 0.5 ? SP_RH : SP_RV);
        });
        this.emit("convert");
      }
      extra = [...targets, rainCell];
      fxBig.push("rainbow");
      this.score += 500;
    } else if (RIB(x) && RIB(y)) {
      x.sp = SP_RH; y.sp = SP_RV;
      extra = [a, b];
    } else if ((RIB(x) && BOMB(y)) || (BOMB(x) && RIB(y))) {
      x.sp = y.sp = 0;
      const [r, c] = this.rc(b);
      const set = new Set();
      for (let k = -1; k <= 1; k++) {
        if (r + k >= 0 && r + k < N) this.rowCells(r + k).forEach(i => set.add(i));
        if (c + k >= 0 && c + k < N) this.colCells(c + k).forEach(i => set.add(i));
      }
      extra = [...set];
      fxBig.push("cross3");
      this.score += 600;
    } else if (BOMB(x) && BOMB(y)) {
      x.sp = y.sp = 0;
      extra = this.square(b, 2);
      fxBig.push("bomb2");
      this.score += 600;
    }
    if (this.record && fxBig.length) this.events.push({ kind: "bigfx", fx: fxBig, at: b, snap: this.snapshot() });
    this.clearCells([], extra, [], 1);
  }
  // hammer booster: break one cell, no move used
  hammer(i) {
    if (!this.mask[i]) return false;
    if (!this.tiles[i] && !this.crate[i]) return false;
    if (this.tiles[i] && this.tiles[i].color === CHARM) return false;
    this.clearCells([], [i], [], 1);
    this.gravity();
    this.resolve(null);
    this.settle();
    return true;
  }
  shuffleBooster() { this.shuffle(); this.settle(); }
  // give starting specials (booster)
  addStartSpecial(sp) {
    const cells = [];
    this.tiles.forEach((t, i) => { if (t && t.color >= 0 && !t.sp) cells.push(i); });
    if (!cells.length) return;
    const i = cells[Math.floor(this.rng() * cells.length)];
    const t = this.tiles[i];
    t.sp = sp;
    if (sp === SP_RAIN) t.color = RAINBOW;
    this.emit("convert");
  }
  // win finale: leftover moves become ribbons that fire
  finale() {
    const n = Math.min(this.movesLeft, 15);

function botValue(e) {

  "XX....XX/X......X/......../......../......../......../X......X/XX....XX",
  "XX....XX/XX....XX/......../......../......../......../XX....XX/XX....XX",
  "......../......../......../...XX.../...XX.../......../......../........",
  "......../......../X......X/XX....XX/XX....XX/X......X/......../........",
  "......../.X....X./......../...XX.../...XX.../......../.X....X./........",
  "XXX..XXX/XX....XX/X......X/......../......../X......X/XX....XX/XXX..XXX",

  "X.X..X.X/......../......../......../......../......../......../........",

  else if (n <= 11) types = n % 2 ? ["collect"] : ["score", "collect"];
  else if (n <= 30) types = ["collect", "glass", "glass", "score"];
  else if (n < 80) types = ["collect", "glass", "score"];
  else if (n < 150) types = ["collect", "glass", "crate", "crate"];
  else types = ["collect", "glass", "crate", "charm", "charm"];
  const goalTypes = [pick(types)];

    for (let r = 0; r < N; r++) for (let c = 0; c < N / 2; c++) {

// Run the bot several times; the level's move limit comes from how many moves the bot needed.
// Relaxing levels: ~90% of bot runs finish in time (+ a little extra). Hard: ~50%. Boss: ~35%.
function* tuneLevelSteps(n) {
  for (let variant = 0; variant < 4; variant++) {
    const cfg = genLevel(n, variant);
    const runs = n <= 30 ? 6 : 8;
    const needed = [];
    for (let k = 0; k < runs; k++) {
      needed.push(botPlay(cfg, hashInt(n * 31 + variant * 977 + k), 70));
      yield null; // let the UI breathe between runs
    }
    needed.sort((a, b) => a - b);
    const finished = needed.filter(v => v !== Infinity);
    if (finished.length < Math.ceil(runs * 0.6)) continue; // too hard, try another layout
    const q = (p) => needed[Math.min(runs - 1, Math.floor(p * (runs - 1)))];
    let moves;
    if (cfg.boss) moves = q(0.35);
    else if (cfg.hard) moves = q(0.5);
    else moves = q(0.75) + (n <= 10 ? 7 : n <= 30 ? 4 : 3);
    if (moves === Infinity) moves = finished[finished.length - 1] + 2;
    moves = Math.max(10, Math.min(35, Math.ceil(moves)));
    yield { cfg: { ...cfg, moves }, stats: needed };
    return;
  }
  // fallback: simple score level that is always fine
  const cfg = genLevel(n, 0);
  cfg.goals = [{ type: "score", amount: 3000 }];
  cfg.glass = cfg.glass.map(() => 0); cfg.crate = cfg.crate.map(() => 0);
  yield { cfg: { ...cfg, moves: 25 }, stats: [] };
}

  let out = null;
  for (const step of tuneLevelSteps(n)) if (step) out = step;

}

// ---------- level preparation (tuning runs the bot; cached) ----------
const levelReady = {};

  const cfg = genLevel(n, entry.variant);

    cfg.goals = [{ type: "score", amount: 3000 }];
    cfg.glass = cfg.glass.map(() => 0); cfg.crate = cfg.crate.map(() => 0);
  }

}
async function prepareLevel(n) {

  if (entry && entry.v === GEN_VERSION) return cfgFromCache(n, entry);
  if (levelReady[n]) return levelReady[n];
  levelReady[n] = (async () => {
    let result = null;
    for (const step of tuneLevelSteps(n)) {
      if (step) result = step;
      await new Promise(r => setTimeout(r, 0));
    }
    const fb = result.stats.length === 0;
    state.levelCache[n] = { v: GEN_VERSION, variant: result.cfg.variant, moves: result.cfg.moves, fb };
    // keep the cache small
    const keys = Object.keys(state.levelCache).map(Number).sort((a, b) => a - b);
    while (keys.length > 30) delete state.levelCache[keys.shift()];
    save();
    delete levelReady[n];
    return cfgFromCache(n, state.levelCache[n]);
  })();

}

function cellPos(el, i) {

  el.style.transform = `translate(${c * 100}%, ${r * 100}%)`;
}
function buildCells(e) {
  const layer = document.getElementById("cellLayer");

    if (!e.mask[i]) continue;

}
function updateCells(snap) {
  document.querySelectorAll("#cellLayer .cell").forEach(d => {
    const g = snap.glass[+d.dataset.i];
    d.classList.toggle("glass1", g === 1);
    d.classList.toggle("glass2", g >= 2);
  });
  const layer = document.getElementById("crateLayer");
  const existing = new Map([...layer.children].map(el => [+el.dataset.i, el]));
  snap.crate.forEach((hp, i) => {
    const el = existing.get(i);
    if (hp > 0) {
      if (!el) {
        const d = document.createElement("div");
        d.className = "crate"; d.dataset.i = i; d.dataset.hp = hp;
        d.style.left = (i % N) * 12.5 + "%"; d.style.top = Math.floor(i / N) * 12.5 + "%";
        d.innerHTML = GIFT_SVG(hp);
        layer.appendChild(d);
      } else if (+el.dataset.hp !== hp) { el.dataset.hp = hp; el.innerHTML = GIFT_SVG(hp); }
    } else if (el && !el.classList.contains("gone")) {
      el.classList.add("gone"); setTimeout(() => el.remove(), 300);
    }

}
function applySnap(snap, kind) {
  const layer = document.getElementById("tileLayer");
  const spawnCount = {};
  for (const [id, i] of snap.tiles) if (!tileEls.has(id)) { const c = i % N; spawnCount[c] = (spawnCount[c] || 0) + 1; }
  const seen = new Set();
  for (const [id, i, color, sp] of snap.tiles) {
    seen.add(id);
    let el = tileEls.get(id);
    if (!el) {
      el = document.createElement("div");
      el.className = "tile noanim sp" + sp;
      el.innerHTML = tileSvg(color, sp);
      el._c = color; el._sp = sp;
      const r = Math.floor(i / N), c = i % N;
      if (kind === "fall" || kind === "init") {
        const startR = kind === "init" ? r - N : r - spawnCount[c];
        el.style.transform = `translate(${c * 100}%, ${startR * 100}%)`;
      } else {
        cellPos(el, i); el.classList.add("appear");
      }
      layer.appendChild(el);
      tileEls.set(id, el);
      void el.offsetWidth;
      el.classList.remove("noanim");
    } else if (el._c !== color || el._sp !== sp) {
      el._c = color; el._sp = sp;
      el.className = "tile sp" + sp;
      el.innerHTML = tileSvg(color, sp);
      el.classList.add("appear");
    }
    cellPos(el, i);
  }
  for (const [id, el] of tileEls) {

  setTimeout(() => d.remove(), 1000);
}
function shake() { boardEl.classList.remove("shake"); void boardEl.offsetWidth; boardEl.classList.add("shake"); }
const wait = (ms) => new Promise(r => setTimeout(r, ms));
const CHEERS = ["Sweet!", "Lovely!", "Gorgeous!", "Fabulous!", "Dazzling!"];

async function playEvents(events) {
  const g = G;
  for (const ev of events) {
    if (G !== g || !G) return; // level was closed
    switch (ev.kind) {
      case "swap": SFX.play("swap"); applySnap(ev.snap, "swap"); await wait(170); break;
      case "swapBack": SFX.play("nope"); applySnap(ev.snap, "swap"); await wait(190); break;
      case "convert": SFX.play("sparkle"); applySnap(ev.snap, "convert"); await wait(320); break;
      case "bigfx":
        SFX.play("combo"); shake();
        ev.fx.forEach(f => {
          if (f.startsWith("rainbow")) { const d = document.createElement("div"); d.className = "rainfx"; document.getElementById("fxLayer").appendChild(d); setTimeout(() => d.remove(), 800); }
          if (f === "bomb2") fxAt(ev.at, "burst", 6);
          if (f === "cross3") { for (let k = -1; k <= 1; k++) { fxBeam(ev.at + k * N, false); fxBeam(ev.at + k, true); } }
        });
        await wait(200); break;
      case "clear": {
        ev.fx.forEach(f => {
          if (f.sp === SP_RH) fxBeam(f.i, false);
          if (f.sp === SP_RV) fxBeam(f.i, true);
          if (f.sp === SP_BOMB) fxAt(f.i, "burst", 3.4);
          if (f.sp === SP_RAIN) { const d = document.createElement("div"); d.className = "rainfx"; document.getElementById("fxLayer").appendChild(d); setTimeout(() => d.remove(), 800); }
        });
        if (ev.fx.length) { SFX.play("blast"); if (ev.fx.length > 1) shake(); }
        SFX.play("pop", ev.cascade || 1);
        if ((ev.cascade || 0) >= 3 && ev.cleared.length) floatText(CHEERS[Math.min(CHEERS.length - 1, ev.cascade - 3)]);
        applySnap(ev.snap, "clear");
        await wait(ev.fx.length ? 300 : 230);
        break;
      }
      case "fall": applySnap(ev.snap, "fall"); await wait(230); break;
      case "charm": SFX.play("charm"); ev.cells.forEach(i => floatText("+1 🏅", i)); applySnap(ev.snap, "clear"); await wait(380); break;
      case "shuffle": SFX.play("sparkle"); floatText("Shuffle!"); applySnap(ev.snap, "shuffle"); await wait(450); break;
    }
  }
}

// ---------- input ----------
let selected = -1, dragStart = null, hammerMode = false, hintTimer = null;
function cellFromPoint(x, y) {
  const r = boardEl.getBoundingClientRect();
  const c = Math.floor((x - r.left) / r.width * N), row = Math.floor((y - r.top) / r.height * N);
  if (c < 0 || c >= N || row < 0 || row >= N) return -1;
  return row * N + c;
}
function tileElAt(i) { const t = G && G.engine.tiles[i]; return t ? tileEls.get(t.id) : null; }
function setSelected(i) {
  if (selected >= 0) { const el = tileElAt(selected); if (el) el.classList.remove("sel"); }
  selected = i;
  if (i >= 0) { const el = tileElAt(i); if (el) el.classList.add("sel"); }
}
function clearHint() {
  clearTimeout(hintTimer);
  document.querySelectorAll(".tile.hint").forEach(el => el.classList.remove("hint"));
}
function scheduleHint() {
  clearHint();
  hintTimer = setTimeout(() => {
    if (!G || G.busy) return;
    const moves = G.engine.findMoves(6);
    if (!moves.length) return;
    const [a, b] = moves[Math.floor(Math.random() * moves.length)];
    [a, b].forEach(i => { const el = tileElAt(i); if (el) el.classList.add("hint"); });
  }, 6000);
}
boardEl.addEventListener("pointerdown", (e) => {
  if (!G || G.busy || G.over) return;
  const i = cellFromPoint(e.clientX, e.clientY);
  if (i < 0) return;
  SFX.unlock();
  if (hammerMode) { useHammer(i); return; }
  if (!G.engine.tiles[i]) return;
  if (selected >= 0 && selected !== i && G.engine.adjacent(selected, i)) {
    const a = selected; setSelected(-1); doSwap(a, i); return;
  }
  setSelected(i);
  dragStart = { i, x: e.clientX, y: e.clientY };
  boardEl.setPointerCapture(e.pointerId);
});
boardEl.addEventListener("pointermove", (e) => {
  if (!dragStart || !G || G.busy) return;
  const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
  const cs = boardEl.getBoundingClientRect().width / N;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < cs * 0.35) return;
  const i = dragStart.i; dragStart = null;
  const r = Math.floor(i / N), c = i % N;
  let j = -1;
  if (Math.abs(dx) > Math.abs(dy)) j = dx > 0 ? (c < N - 1 ? i + 1 : -1) : (c > 0 ? i - 1 : -1);
  else j = dy > 0 ? (r < N - 1 ? i + N : -1) : (r > 0 ? i - N : -1);
  setSelected(-1);
  if (j >= 0 && G.engine.tiles[j]) doSwap(i, j);
});
boardEl.addEventListener("pointerup", () => { dragStart = null; });
boardEl.addEventListener("pointercancel", () => { dragStart = null; });

async function doSwap(a, b) {
  const g = G;
  g.busy = true; clearHint();
  const used = g.engine.trySwap(a, b);
  await playEvents(g.engine.takeEvents());
  if (G !== g) return; // she left the level mid-animation
  g.busy = false;
  if (used) afterMove(); else scheduleHint();
}
async function useHammer(i) {
  if (state.boosters.hammer <= 0) return;
  G.busy = true; clearHint();
  setHammer(false);
  const g = G;
  if (g.engine.hammer(i)) {
    state.boosters.hammer--; save(); updateBoosterBtns();
    SFX.play("hammer"); fxAt(i, "burst", 1.6); shake();
    await playEvents(g.engine.takeEvents());
  }
  if (G !== g) return;
  g.busy = false;
  afterMove();
}
function setHammer(on) {
  hammerMode = on;
  document.getElementById("hammerBtn").classList.toggle("on", on);
}
function updateBoosterBtns() {
  document.getElementById("hammerCount").textContent = state.boosters.hammer || "+";
  document.getElementById("shuffleCount").textContent = state.boosters.shuffle || "+";
}
document.getElementById("hammerBtn").onclick = () => {
  if (!G || G.busy || G.over) return;
  if (state.boosters.hammer <= 0) { offerBooster("hammer"); return; }
  setHammer(!hammerMode);
  if (hammerMode) toast("Tap any tile or gift box to smash it 🔨");
};
document.getElementById("shuffleBtn").onclick = async () => {
  if (!G || G.busy || G.over) return;
  if (state.boosters.shuffle <= 0) { offerBooster("shuffle"); return; }
  state.boosters.shuffle--; save(); updateBoosterBtns();
  const g = G;
  g.busy = true; clearHint();
  g.engine.shuffleBooster();
  await playEvents(g.engine.takeEvents());
  if (G !== g) return;
  g.busy = false; scheduleHint();
};

// ---------- level flow ----------
function starsFor(e, cfg) {
  const frac = e.movesLeft / cfg.moves;
  const [a, b] = cfg.hard ? [0.25, 0.1] : [0.4, 0.2];
  return frac >= a ? 3 : frac >= b ? 2 : 1;
}
async function afterMove() {
  if (!G) return;
  const g = G, e = g.engine;
  if (e.isWon()) {
    g.over = true;
    const stars = starsFor(e, g.cfg);
    await wait(250);
    if (e.movesLeft > 0) {
      floatText("Sparkle Finale! ✨");
      SFX.play("combo");
      await wait(600);
      g.finale = e.finale();
      await playEvents(e.takeEvents());
    }
    await wait(300);
    if (G !== g) return;
    winLevel(stars);
    return;
  }
  if (e.movesLeft <= 0) { g.over = true; await wait(400); if (G === g) loseLevel(); return; }
  scheduleHint();
}

async function startLevel(n, opts = {}) {
  const pre = opts.retry ? null : await preLevel(n);
  if (!opts.retry && !pre) return; // closed
  const cfg = pre ? pre.cfg : G.cfg;
  const picks = pre ? pre.picks : {};
  const engine = new Engine(cfg, mulberry32((Date.now() ^ (n * 2654435761)) >>> 0), true);
  if (picks.startMoves) { engine.movesLeft += 3; }
  G = { n, cfg, engine, busy: true, over: false, finale: 0, extraMovesBought: 0 };
  setSelected(-1); setHammer(false); clearHint();
  // reset board
  tileEls.forEach(el => el.remove()); tileEls.clear();
  document.getElementById("crateLayer").innerHTML = "";
  document.getElementById("fxLayer").innerHTML = "";
  buildCells(engine);
  const { hard, boss } = cfg;
  document.getElementById("playTitle").textContent = "Level " + n.toLocaleString();
  document.getElementById("playSub").innerHTML = boss ? `<span class="badge-hard">Boss Challenge</span>` : hard ? `<span class="badge-hard">Challenge</span>` : "";
  updateBoosterBtns();
  document.getElementById("playScreen").classList.add("open");
  await wait(360);
  applySnap(engine.snapshot(), "init");
  engine.takeEvents();
  await wait(350);
  if (picks.startBomb) engine.addStartSpecial(SP_BOMB);
  if (picks.startRain) engine.addStartSpecial(SP_RAIN);
  await playEvents(engine.takeEvents());
  if (TIPS[n] && !state.tips[n]) {
    state.tips[n] = 1; save();
    await modal(`<div class="tip-art">${TIPS[n][0]}</div><p style="color:var(--ink);font-size:17px">${TIPS[n][1]}</p>`, [{ label: "Got it!", main: true }]);
  }
  G.busy = false;
  scheduleHint();
}

// pre-level popup: shows goals, prepares (tunes) the level, lets her pick starting boosters
async function preLevel(n) {
  const info = levelInfo(n);
  const picks = { startMoves: false, startBomb: false, startRain: false };
  let cfg = null;
  const p = prepareLevel(n).then(c => { cfg = c; return c; });
  const boostBtn = (key, ico, label) =>
    `<button class="boost" data-pick="${key}"><span class="ico">${ico}</span>${label}<span class="count">${state.boosters[key] || "+"}</span></button>`;
  const result = await modal(`
      <h3>Level ${n.toLocaleString()}</h3>
      ${info.boss ? `<span class="badge-hard">Boss Challenge</span>` : info.hard ? `<span class="badge-hard">Challenge</span>` : ""}
      <div id="preBody"><div class="spinner"></div><p>Getting your level ready ✨</p></div>
      <p style="margin-bottom:4px">Start with a booster?</p>
      <div class="pre-boosts">
        ${boostBtn("startMoves", "➕", "+3 Moves")}${boostBtn("startBomb", "✨", "Bomb")}${boostBtn("startRain", "🌈", "Rainbow")}
      </div>`,
    [{ label: "Play!", main: true, value: "play", id: "go" }, { label: "Not now", value: null }],
    {
      onOpen: (root) => {
        const go = root.querySelector('[data-id="go"]');
        go.disabled = true;
        p.then((c) => {
          root.querySelector("#preBody").innerHTML =
            `<div class="goals">${goalsHtml(c.goals)}</div><p>${goalSentence(c.goals)} in <b>${c.moves}</b> moves</p>`;
          go.disabled = false;
        });
        root.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
          const k = b.dataset.pick;
          if (!state.boosters[k]) { toast("Get more boosters in the Shop 🛍️"); return; }
          picks[k] = !picks[k];
          b.classList.toggle("on", picks[k]);
        });
      },
    });
  if (result !== "play") return null;
  await p;
  for (const k of Object.keys(picks)) if (picks[k]) { state.boosters[k]--; }
  save();
  return { cfg, picks };
}

function coinsFor(stars, cfg, finale) {
  return 25 + stars * 10 + (cfg.hard ? 20 : 0) + (cfg.boss ? 20 : 0) + finale * 3;
}
async function winLevel(stars) {
  const n = G.n;
  SFX.play("win");
  const coins = coinsFor(stars, G.cfg, G.finale);
  const firstClear = state.level <= n;
  state.coins += coins;
  state.stars[n] = Math.max(state.stars[n] || 0, stars);
  // keep the stars map small: only recent levels
  const keys = Object.keys(state.stars).map(Number);
  if (keys.length > 200) keys.sort((a, b) => a - b).slice(0, keys.length - 200).forEach(k => delete state.stars[k]);
  if (firstClear) state.level = n + 1;
  save(); renderHud(); renderShelf();
  prepareLevel(n + 1); // get the next one ready in the background
  let unlockMsg = "";
  if (firstClear && n % LEVELS_PER_COMPACT === 0) {
    const ci = n / LEVELS_PER_COMPACT;
    if (COMPACTS[ci]) unlockMsg = `<p style="color:var(--ink)">🎉 New compact unlocked: <b>${COMPACTS[ci].name}</b>!</p>`;
  }
  const res = await modal(`
      <h3>Level Complete!</h3>
      <div class="stars" id="winStars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
      <div class="coin-reward">+${coins} coins</div>
      <p>Score ${G.engine.score.toLocaleString()}</p>${unlockMsg}`,
    [{ label: `Next Level <small>Level ${(n + 1).toLocaleString()}</small>`, main: true, value: "next" }, { label: "Home", value: "home" }],
    { onOpen: (root) => root.querySelectorAll("#winStars span").forEach((s, k) => setTimeout(() => { if (k < stars) { s.classList.add("on"); SFX.play("star", k); } }, 300 + k * 350)) });
  if (res === "next") startLevel(n + 1);
  else closePlay();
}
async function loseLevel() {
  SFX.play("lose");
  const e = G.engine;
  const cost = 120 + G.extraMovesBought * 60;
  const haveBooster = state.boosters.moves5 > 0;
  const res = await modal(`
      <h3>Out of moves!</h3>
      <div class="goals">${goalsHtml(G.cfg.goals, e.goals.map(g => g.left))}</div>
      <p>So close! Want 5 more moves?</p>`,
    [{ label: haveBooster ? `+5 Moves <small>use 1 of your ${state.boosters.moves5}</small>` : `+5 Moves <small>${cost} coins</small>`, main: true, value: "more" },
     { label: "Try Again", value: "retry" }, { label: "Home", value: "home" }]);
  if (res === "more") {
    if (haveBooster) state.boosters.moves5--;
    else if (state.coins >= cost) { state.coins -= cost; G.extraMovesBought++; }
    else { toast(`You need ${cost - state.coins} more coins 💕`); loseLevel(); return; }
    save(); renderHud();
    e.movesLeft += 5; G.over = false;
    updateHud(e.snapshot());
    scheduleHint();
    return;
  }
  if (res === "retry") { startLevel(G.n, { retry: true }); return; }
  closePlay();
}
function closePlay() {
  clearHint(); setHammer(false);
  G = null;
  document.getElementById("playScreen").classList.remove("open");
  renderHud(); renderShelf();
}
document.getElementById("playBack").onclick = async () => {
  if (!G) return;
  if (G.over) { closePlay(); return; }
  if (G.busy) return;
  const res = await modal(`<h3>Leave level?</h3><p>You can come back and play it again anytime.</p>`,
    [{ label: "Keep Playing", main: true, value: "stay" }, { label: "Leave", value: "leave" }]);
  if (res === "leave") closePlay();
};
async function offerBooster(key) {
  const item = SHOP_ITEMS.find(s => s.key === key);
  const res = await modal(`<div class="tip-art">${item.ico}</div><h3>${item.name}</h3><p>${item.desc}</p>`,
    [{ label: `Buy for ${item.price} coins <small>You have ${state.coins.toLocaleString()}</small>`, main: true, value: "buy" }, { label: "Not now", value: null }]);
  if (res === "buy") buyBooster(item);
}

// Home "Play" button
document.getElementById("playBtn").onclick = (e) => { sparkle(e.clientX, e.clientY); SFX.unlock(); startLevel(state.level); };
// get the current level ready in the background so the first tap is instant
setTimeout(() => prepareLevel(state.level), 600);

</script>
</body>
